server.port=8081

# ===== 数据源（本地 MySQL，root / 123456；库不存在时自动创建） =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/jojo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456

# ===== 建表与初始化数据（幂等：CREATE IF NOT EXISTS / INSERT IGNORE） =====
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true

# ===== MyBatis-Plus =====
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-prefix=

# ===== JWT 配置 =====
jwt.secret=jojoGoldenSpiritSuperSecretKey2026!!
jwt.expiration=86400000
